services:

  mysql:
    image: mysql:8.4
    container_name: fileforge-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_NAME:-fileforge}
      MYSQL_USER: ${DB_USER:-fileforge_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}

    volumes:
      - fileforge_mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - fileforge


  app:
    build: .
    container_name: fileforge-app
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-fileforge_user}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-fileforge}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}

    expose:
      - "5000"

    networks:
      - fileforge


  nginx:
    image: nginx:alpine
    container_name: fileforge-nginx
    restart: unless-stopped

    depends_on:
      - app

    ports:
      - "80:80"

    volumes:
      - ./deploy/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - fileforge


volumes:
  fileforge_mysql_data:


networks:
  fileforge: